[project]
name = "ErisPulse-GovReport"
version = "0.1.1"
description = "治理观测模块：命令执行/事件拦截/配额消耗统计 —— Governance observability: command execution, blocked-event and usage-quota stats with ORM persistence and Takumi report cards"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "wsu2059q" } ]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ErisPulse-Testing",
]

[project.entry-points."erispulse.module"]
"GovReport" = "GovReport:Main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["GovReport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
